name: Release

'on':
  create:

permissions:
  contents: read

jobs:
  android:
    name: Android release
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.p12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Android signing key
        shell: bash
        run: |
          set +x
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed Android release
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease --no-daemon

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab

  desktop:
    name: Desktop release (${{ matrix.os }})
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build desktop distributable
        shell: bash
        run: ./gradlew :composeApp:createDistributable --no-daemon

      - name: Archive desktop distributable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appDir = "composeApp/build/compose/binaries/main/app"
          if (!(Test-Path -LiteralPath $appDir)) {
            throw "Desktop distributable directory was not created: $appDir"
          }
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $archive = "artifacts/habrrss-desktop-$env:RUNNER_OS.zip"
          Compress-Archive -Path "$appDir/*" -DestinationPath $archive -Force

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: artifacts/*.zip

  publish:
    name: Publish GitHub release
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Automated HabrRSS release."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release-artifacts/*
